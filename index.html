<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Scrabble</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="selectBox">
    <h1>Scrabble</h1>
</div>

<div id="addingPage">
    <div class="selectBox">
        <input id="nickInput" placeholder="Imię gracza" enterkeyhint="go">
        <button id="nickButton">Dodaj gracza</button>
        <ul id="playersList">
        </ul>

        <button id="playButton">Graj</button>
    </div>
</div>

<div id="scrablePage" hidden>

    <div id="playersBox"></div>

    <div class="selectBox">
        <input id="pointsInput" placeholder="Zdobyte punkty" type="number">
        <button id="addPointsButton">Dodaj</button>
    </div>

    <div class="selectBox">
        <select name="Czas" id="timerSelect">
            <option value="30">30 sek</option>
            <option value="60">1 min</option>
            <option value="120" selected>2 min</option>
            <option value="180">3 min</option>
            <option value="300">5 min</option>
        </select>
        <h1 id="timer">0</h1>
        <button id="startTimerButton">Start</button>
        <button id="stopTimerButton">Stop</button>
    </div>

    <div class="selectBox">
        <a href="https://www.pfs.org.pl/osps_mobile.php" target="_blank">Sprawdź słowo w słowniku</a>
    </div>

    <div class="selectBox">
        <span>Liczba graczy w wierszu</span>
        <select id="gridSelect">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
        </select>
    </div>
</div>

<script src="adding.js"></script>
<script src="scrable.js"></script>

</body>
